name: "星驰API 自动签到 v11"
description: "浏览器登录自动保存令牌，每天自动签到并显示余额"
author: "ayioyiyo"
homepage: "https://github.com/ayioyiyo/egern-scripts"
icon: "checkmark.circle.fill"

env_schema:
  XINGCHI_CAPTURE:
    name: "抓取令牌"
    description: "开启后，浏览器登录站点时自动保存令牌；关闭后完全不拦截任何请求，签到仍照常运行。"
    options:
      - "on"
      - "off"
    default_value: "on"

mitm:
  hostnames:
    - "xingchiapi.com"
    - "api.xingchiapi.com"

http_captures:
  - "api.xingchiapi.com"

scriptings:
  # 请求脚本：从 Authorization 头读令牌（浏览器调 /user/* 时触发，最稳的来源）
  - http_request:
      name: "星驰API 令牌抓取（请求） v11"
      match: "^https://(api\\.)?xingchiapi\\.com/api/v1/"
      script_url: "https://raw.githubusercontent.com/ayioyiyo/egern-scripts/main/xingchi_capture.js"
      body_required: false
      timeout: 10

  # 响应脚本：从 /auth/ 响应体读 access_token / refresh_token
  - http_response:
      name: "星驰API 令牌抓取（响应） v11"
      match: "^https://(api\\.)?xingchiapi\\.com/api/v1/auth/"
      script_url: "https://raw.githubusercontent.com/ayioyiyo/egern-scripts/main/xingchi_capture.js"
      body_required: true
      timeout: 10

  - schedule:
      name: "星驰API 签到 v11"
      cron: "5 8 * * *"
      script_url: "https://raw.githubusercontent.com/ayioyiyo/egern-scripts/main/xingchi_checkin.js"
      timeout: 60
