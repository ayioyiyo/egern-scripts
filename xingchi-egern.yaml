name: "星驰API 自动签到 v9"
description: "浏览器登录一次自动保存令牌，每天自动签到并显示余额"
author: "ayioyiyo"
homepage: "https://github.com/ayioyiyo/egern-scripts"
icon: "checkmark.circle.fill"

# 模块设置页里的原生开关（不是脚本）
env_schema:
  XINGCHI_CAPTURE:
    name: "抓取令牌"
    description: "开启后，浏览器登录站点时自动保存令牌；关闭后完全不拦截任何请求，签到仍照常运行。"
    options:
      - "on"
      - "off"
    default_value: "on"

mitm:
  hostnames:
    - "xingchiapi.com"
    - "api.xingchiapi.com"

http_captures:
  - "api.xingchiapi.com"

scriptings:
  # 只拦截鉴权相关接口，静态资源不触发脚本
  - http_request:
      name: "星驰API 令牌捕获 v9"
      match: "^https://(api\\.)?xingchiapi\\.com/api/v1/(auth|user)/"
      script_url: "https://raw.githubusercontent.com/ayioyiyo/egern-scripts/main/xingchi_capture.js"
      body_required: true
      timeout: 20

  - http_response:
      name: "星驰API 令牌捕获（响应） v9"
      match: "^https://(api\\.)?xingchiapi\\.com/api/v1/auth/"
      script_url: "https://raw.githubusercontent.com/ayioyiyo/egern-scripts/main/xingchi_capture.js"
      body_required: true
      timeout: 20

  - schedule:
      name: "星驰API 签到 v9"
      cron: "5 8 * * *"
      script_url: "https://raw.githubusercontent.com/ayioyiyo/egern-scripts/main/xingchi_checkin.js"
      timeout: 60
